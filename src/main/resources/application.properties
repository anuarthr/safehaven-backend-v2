spring.application.name=safeHaven

# ---------------------------------------------------------------------------
# Base de datos (sobreescribir con variables de entorno en despliegue)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/safeHaven}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# CORS - origen(es) permitido(s) del frontend (lista separada por comas)
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# JWT - el secreto DEBE sobreescribirse en producción (valor base64, >= 256 bits)
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:c2FmZWhhdmVuLWRldi1vbmx5LXNlY3JldC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2LTB4Q0FGRQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# JPA / Hibernate - el esquema lo gestiona Flyway, Hibernate solo valida
# ---------------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------------
# Flyway - única fuente de verdad del esquema y los datos semilla
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration
